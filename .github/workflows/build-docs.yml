name: Build docs

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - 'next-sdk/docs/**'
      - 'tiny-robot/docs/**'
      - 'tiny-vue/examples/sites/demos/pc/webdoc/**'
      - 'tiny-engine/docs/**'  
      - '.vitepress/**'
  workflow_dispatch: {}  # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 注入私钥（支持多行）
      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_SSH_KEY }}

      # 3. 现在 checkout（含递归子模块）
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Configure Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      - name: Ensure submodules are up-to-date (pull latest from their remote)
        # 这一步会把子模块更新到各自远端的最新分支（通常是子模块配置的上游）
        run: |
          git submodule update --init --recursive
          # 打印状态便于调试
          git submodule status --recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install deps
        run: pnpm i
      - name: Build @opentiny/tiny-robot
        run: pnpm -F robot-root build
      - name: Build site
        run: pnpm build
